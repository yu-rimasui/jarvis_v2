name: CI

on:
  pull_request:
  workflow_dispatch:

# CI only needs to read the repository. No credentials or write access are required.
permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        timeout-minutes: 5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
        timeout-minutes: 5

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Typecheck
        run: npm run typecheck
        timeout-minutes: 10

      - name: Run tests
        run: npm test
        timeout-minutes: 10
