[build-system]
requires = ["setuptools>=75,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-v2"
version = "0.1.0"
description = "Local-first Jarvis application foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlmodel>=0.0.22,<1",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jarvis"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
